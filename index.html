<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>illinc</title>
    <link rel="stylesheet" href="stylesheets/style.css" />
    <script defer src="javascripts/scripts.js"></script>
    <link rel="icon" href="images/icon.svg" />
  </head>
  <body>
    <section class="screen-1">
      <section class="text-1">
        <p>кинотеатр</p>
        <p>других</p>
        <p>вариантов</p>
        <p>жизни</p>
      </section>

      <img
        class="illinclogo"
        src="images/screen-1/illinclogo.svg"
        alt="illinclogo"
      />
      <!-- <div class="clock" id="date"></div> -->
      <div class="clock" id="clock"></div>
      <section class="text-2">
        <p>посмотри</p>
        <p>на</p>
        <p>момент</p>
        <p>из</p>
        <p>жизни</p>
        <p>с</p>
        <p>другой</p>
        <p>стороны,</p>
        <p>просто</p>
        <p>выбрав</p>
        <p>плёнку</p>
      </section>
    </section>

    <section class="screen-2">
      <section class="buttons">
        <button class="button1" id="button1"></button>
        <button class="button2" id="button2"></button>
        <button class="button3" id="button3"></button>
        <button class="button4" id="button4"></button>
      </section>
    </section>

    <section class="screen-3">
      <img class="photos" src="images/screen-3/photos.svg" alt="photos" />
      <img
        class="photobooth"
        src="images/screen-3/photobooth.svg"
        alt="photobooth"
      />
      <img
        class="photofilm"
        src="images/screen-3/photofilm.svg"
        alt="photofilm"
      />
    </section>

    <section class="screen-4">
      <!-- <img class="dragg" src="images/photo2.svg" alt="photo2" />
      <img src="images/photo1.svg" alt="photo1" class="photo1 dragg" />
      <img class="dragg" src="images/photo3.svg" alt="photo3" />
      <img class="dragg" src="images/photofilm.svg" alt="photofilm" />
      <img class="dragg" src="images/names.png" alt="names" /> -->
    </section>

    <section>
      <section class="film1" id="film1">
        <button class="buttoninfilm1" id="buttoninfilm1"></button>
      </section>
      <section class="film2" id="film2">
        <button class="buttoninfilm2" id="buttoninfilm2"></button>
      </section>
      <section class="film3" id="film3">
        <button class="buttoninfilm3" id="buttoninfilm3"></button>
      </section>
    </section>
  </body>
</html>
