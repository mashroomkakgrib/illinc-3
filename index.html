<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>illinc</title>
    <link rel="stylesheet" href="stylesheets/style.css" />
    <script defer src="javascripts/scripts.js"></script>
    <link rel="icon" href="images/icon.svg" />
  </head>
  <body>
    <section class="screen-1">
      <section class="text-1">
        <p>кинотеатр</p>
        <p>других</p>
        <p>вариантов</p>
        <p>жизни</p>
      </section>

      <img class="illinclogo" src="images/illinclogo.svg" alt="illinclogo" />
      <img class="frame" src="images/frame.svg" alt="frame" />

      <div class="clock" id="clock"></div>
    </section>

    <section class="screen-2">
      <section class="text-2">
        <p>посмотри</p>
        <p>на</p>
        <p>момент</p>
        <p>из</p>
        <p>жизни</p>
        <p>с</p>
        <p>другой</p>
        <p>стороны,</p>
        <p>просто</p>
        <p>выбрав</p>
        <p>плёнку</p>
      </section>

      <section class="buttons">
        <button class="button1" id="button1"></button>
        <button class="button2" id="button2"></button>
        <button class="button3" id="button3"></button>
      </section>
    </section>

    <section class="screen-3">
      <img src="images/card1.svg" alt="card1" />
      <img src="images/card2.svg" alt="card2" />
      <img src="images/card3.svg" alt="card3" />
      <p>Анна Комкова</p>
      <p>Дарья Зародина</p>
    </section>

    <section class="film1" id="film1"></section>
    <section class="film2" id="film2"></section>
    <section class="film3" id="film3"></section>
  </body>
</html>
