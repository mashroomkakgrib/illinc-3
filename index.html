<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>illinc</title>
    <link rel="stylesheet" href="stylesheets/style.css" />
    <script defer src="javascripts/scripts.js"></script>
    <link rel="icon" href="images/icon.svg" />
  </head>
  <body>
    <section class="screen-1">
      <section class="text-1">
        <p>кинотеатр</p>
        <p>других</p>
        <p>вариантов</p>
        <p>жизни</p>
      </section>

      <img
        class="illinclogo"
        src="images/screen-1/illinclogo.svg"
        alt="illinclogo"
      />
      <div class="date" id="date"></div>
      <div class="clock" id="clock"></div>
      <section class="text-2">
        <p>посмотри</p>
        <p>на</p>
        <p>момент</p>
        <p>из</p>
        <p>жизни</p>
        <p>с</p>
        <p>другой</p>
        <p>стороны,</p>
        <p>просто</p>
        <p>выбрав</p>
        <p>плёнку</p>
      </section>
    </section>

    <section class="screen-2">
      <section class="buttons">
        <button class="button1" id="button1"></button>
        <button class="button2" id="button2"></button>
        <button class="button3" id="button3"></button>
        <button class="button4" id="button4"></button>
      </section>
    </section>

    <section class="screen-3">
      <img
        class="photos"
        id="change1"
        src="images/screen-3/photos.svg"
        alt="photos"
      />
      <img
        class="photobooth"
        id="change2"
        src="images/screen-3/photobooth.svg"
        alt="photobooth"
      />
      <img
        class="photofilm"
        id="change3"
        src="images/screen-3/photofilm.svg"
        alt="photofilm"
      />
    </section>

    <section class="screen-4">
      <img class="me dragg" src="images/screen-4/me.svg" alt="me" />
      <img class="camera dragg" src="images/screen-4/camera.svg" alt="camera" />
      <img
        class="photofilm2 dragg"
        src="images/screen-4/photofilm2.svg"
        alt="photofilm"
      />
      <img class="hse dragg" src="images/screen-4/hse.svg" alt="hse" />
      <img
        class="curators dragg"
        src="images/screen-4/curators.svg"
        alt="curators"
      />
    </section>

    <section>
      <section class="film1" id="film1">
        <div class="follower" id="cursor-follower"></div>
        <button class="buttoninfilm" id="buttoninfilm1">вернуться</button>
      </section>
      <section class="film2" id="film2">
        <div class="follower" id="cursor-follower-2"></div>
        <button class="buttoninfilm" id="buttoninfilm2">вернуться</button>
      </section>
      <section class="film3" id="film3">
        <div class="follower" id="cursor-follower-3"></div>
        <button class="buttoninfilm" id="buttoninfilm3">вернуться</button>
      </section>
      <section class="film4" id="film4">
        <div class="follower" id="cursor-follower-4"></div>
        <button class="buttoninfilm" id="buttoninfilm4">вернуться</button>
      </section>
    </section>
  </body>
</html>
